<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lineup — Daily Takedown Assignments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0F1720;
    --panel:#16212C;
    --panel-2:#1C2A37;
    --line:#28394A;
    --chalk:#F1EEE4;
    --chalk-dim:#93A2AF;
    --amber:#E8A33D;
    --amber-dim:#8A6A34;
    --grass:#4C9A5B;
    --grass-dim:#25382A;
    --live-green:#39FF6A;
    --alert:#D9564B;
    --alert-dim:#3A2422;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{ max-width:920px; margin:0 auto; }

  /* ---- header / scoreboard ---- */
  .board{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .board h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.3px;
  }
  .board .sub{ color:var(--chalk-dim); font-size:13.5px; }
  .clock{
    font-family:'Oswald',sans-serif;
    font-size:34px;
    font-weight:500;
    color:var(--amber);
    letter-spacing:1px;
    line-height:1;
  }
  .clock-label{ color:var(--chalk-dim); font-size:11.5px; margin-top:4px; }
  .clock-wrap{ text-align:right; }

  /* ---- controls row ---- */
  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .date-nav{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:6px 8px;
  }
  .date-nav button{
    background:transparent; border:none; color:var(--chalk-dim);
    font-size:18px; cursor:pointer; padding:4px 8px; border-radius:6px;
  }
  .date-nav button:hover{ background:var(--panel-2); color:var(--chalk); }
  .date-nav input[type=date]{
    background:transparent; border:none; color:var(--chalk);
    font-family:'Inter'; font-size:14.5px; font-weight:600;
    padding:4px; color-scheme:dark;
  }
  .shift-toggle-wrap{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px;
  }
  .shift-side{
    font-family:'Inter'; font-size:13px; font-weight:600; color:var(--chalk-dim);
    transition:color .15s;
  }
  .shift-side.active{ color:var(--amber); }
  .toggle-switch{
    width:42px; height:24px; border-radius:14px; border:1px solid var(--line);
    background:var(--panel-2); position:relative; cursor:pointer; padding:0; flex-shrink:0;
    transition:background .2s;
  }
  .toggle-switch.on{ background:var(--amber-dim); border-color:var(--amber); }
  .toggle-knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:var(--chalk); transition:transform .2s;
  }
  .toggle-switch.on .toggle-knob{ transform:translateX(18px); background:var(--amber); }
  .btn{
    font-family:'Inter'; font-weight:600; font-size:13.5px;
    padding:9px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--chalk); cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
    transition:background .12s, border-color .12s;
  }
  .btn:hover{ background:var(--panel-2); }
  .btn-amber{ background:var(--amber); border-color:var(--amber); color:#241705; }
  .btn-amber:hover{ background:#f0ae4c; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .spacer{ flex:1; }

  .status-line{
    font-size:13px; color:var(--chalk-dim); margin:-6px 0 18px 2px; min-height:16px;
  }
  .status-line.err{ color:var(--alert); }

  /* ---- roster panel ---- */
  .roster{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:22px;
  }
  .roster-head{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .roster-head h2{
    font-family:'Oswald'; font-weight:500; font-size:15.5px; margin:0;
    letter-spacing:0.2px; color:var(--chalk);
  }
  .roster-head .chev{ color:var(--chalk-dim); transition:transform .15s; font-size:13px; }
  .roster-body{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .roster-body.collapsed{ display:none; }
  .analyst-row{
    display:flex; align-items:center; gap:10px;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px;
  }
  .analyst-dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
  }
  .analyst-row input[type=text]{
    background:transparent; border:none; color:var(--chalk);
    font-family:'Inter'; font-size:14px; font-weight:500; flex:1; min-width:0;
  }
  .analyst-row input[type=text]:focus{ outline:none; }
  .avail-toggle{
    font-size:12px; font-weight:600; padding:4px 9px; border-radius:20px;
    border:1px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  .avail-toggle.on{ background:var(--grass-dim); color:var(--grass); border-color:var(--grass-dim); }
  .avail-toggle.off{ background:var(--alert-dim); color:var(--alert); border-color:var(--alert-dim); }
  .remove-x{
    background:none; border:none; color:var(--chalk-dim); cursor:pointer;
    font-size:15px; padding:2px 6px; border-radius:5px;
  }
  .remove-x:hover{ color:var(--alert); }
  .add-analyst{
    display:flex; gap:8px; margin-top:4px;
  }
  .add-analyst input{
    flex:1; background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; color:var(--chalk); font-family:'Inter'; font-size:14px;
  }
  .add-analyst input:focus{ outline:1px solid var(--amber-dim); }

  /* ---- summary strip ---- */
  .summary{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .chip{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:9px 14px; font-size:13px; color:var(--chalk-dim); display:flex; gap:7px; align-items:baseline;
  }
  .chip b{ font-family:'Oswald'; font-size:16px; color:var(--chalk); font-weight:600; }
  .chip.warn b{ color:var(--alert); }
  .chip.good b{ color:var(--grass); }

  /* ---- matches list ---- */
  .matches{ display:flex; flex-direction:column; gap:8px; }
  .shift-divider{
    display:flex; align-items:center; gap:14px;
    margin:22px 0 14px;
  }
  .shift-divider-line{
    flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--amber-dim), transparent);
  }
  .shift-divider-label{
    font-family:'Oswald'; font-size:13px; font-weight:600; letter-spacing:0.5px;
    color:var(--amber); white-space:nowrap;
  }
  .match{
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; display:grid;
    grid-template-columns:82px 1fr auto auto;
    align-items:center; gap:14px;
  }
  .match.unassigned{ border-color:var(--alert-dim); background:linear-gradient(90deg, var(--alert-dim) 0%, var(--panel) 6%); }
  .match.reported{ opacity:.62; }
  .m-time{ font-family:'Oswald'; font-size:17px; font-weight:500; color:var(--amber); line-height:1.1; }
  .m-time span{ display:block; font-size:10.5px; color:var(--chalk-dim); font-family:'Inter'; font-weight:600; margin-top:1px; }
  .m-time.after-shift{ color:var(--alert); }
  .m-time.after-shift span{ color:var(--alert); opacity:.85; }
  .m-teams{ min-width:0; }
  .m-teams .vs{ font-size:15px; font-weight:600; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .m-teams .venue{ font-size:12px; color:var(--chalk-dim); margin-top:2px; }
  .m-status{ font-size:12px; font-weight:600; margin-top:4px; }
  .m-countdown{ color:var(--chalk-dim); }
  .m-live{ color:var(--live-green); font-weight:700; letter-spacing:0.3px; animation:livePulse 1.4s ease-in-out infinite; }
  .m-finished{ color:var(--chalk-dim); font-weight:500; opacity:.7; }
  @keyframes livePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
  .m-assign{ display:flex; align-items:center; gap:8px; }
  .assign-dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0; border:1px solid;
  }
  .need-support{
    font-size:12.5px; font-weight:700; color:var(--alert);
    background:var(--alert-dim); border:1px solid var(--alert-dim);
    padding:7px 12px; border-radius:7px; white-space:nowrap;
  }
  .footer-credit{
    text-align:center; color:var(--chalk-dim); font-size:12px;
    margin-top:26px; opacity:.7;
  }
  .m-assign select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--chalk);
    font-family:'Inter'; font-size:13.5px; font-weight:600; padding:7px 10px; border-radius:7px;
    min-width:140px;
  }
  .m-assign select.empty{ border-color:var(--alert-dim); color:var(--alert); }
  .m-report{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--chalk-dim); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .m-report.done{ background:var(--grass-dim); color:var(--grass); border-color:var(--grass-dim); }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--chalk-dim);
  }
  .empty-state .big{ font-family:'Oswald'; font-size:19px; color:var(--chalk); margin-bottom:8px; }

  .manual-add{
    margin-top:14px; border:1px dashed var(--line); border-radius:9px; padding:12px 14px;
  }
  .manual-add summary{ cursor:pointer; font-size:13.5px; color:var(--chalk-dim); font-weight:600; }
  .manual-grid{ display:grid; grid-template-columns:1fr 1fr 110px auto; gap:8px; margin-top:12px; }
  .manual-grid input{
    background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px; color:var(--chalk); font-family:'Inter'; font-size:13.5px;
  }

  @media (max-width:640px){
    .board{ flex-direction:column; align-items:flex-start; }
    .clock-wrap{ text-align:left; }
    .match{ grid-template-columns:1fr; row-gap:8px; }
    .m-time{ display:flex; align-items:baseline; gap:8px; }
    .m-time span{ margin-top:0; }
    .manual-grid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="board">
    <div>
      <h1>Lineup</h1>
      <div class="sub">Daily MLB takedown assignments · IST</div>
    </div>
    <div class="clock-wrap">
      <div class="clock" id="clock">--:--</div>
      <div class="clock-label">India Standard Time</div>
    </div>
  </div>

  <div class="controls">
    <div class="date-nav">
      <button id="prevDay" title="Previous day">‹</button>
      <input type="date" id="dateInput">
      <button id="nextDay" title="Next day">›</button>
    </div>
    <div class="shift-toggle-wrap">
      <span class="shift-side" id="shiftLabel1">Shift 1</span>
      <button class="toggle-switch" id="shiftToggle" role="switch" aria-checked="false" title="Switch shift">
        <span class="toggle-knob"></span>
      </button>
      <span class="shift-side" id="shiftLabel2">Shift 2</span>
    </div>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn btn-amber" id="loadBtn">Check for updates</button>
    <div class="spacer"></div>
    <button class="btn" id="autoAssignBtn">Auto-assign</button>
  </div>
  <div class="status-line" id="statusLine"></div>

  <div class="roster">
    <div class="roster-head" id="rosterHead">
      <h2 id="rosterHeading">Analysts on shift</h2>
      <span class="chev" id="rosterChev">▾</span>
    </div>
    <div class="roster-body" id="rosterBody">
      <div id="analystList"></div>
      <div class="add-analyst">
        <input type="text" id="newAnalystName" placeholder="Add analyst name">
        <button class="btn" id="addAnalystBtn">Add</button>
        <button class="btn btn-amber" id="saveRosterBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="matches" id="matches">
    <div class="empty-state">
      <div class="big">No matches loaded yet</div>
      <div>Pick a date above — matches load automatically from the schedule snapshot.</div>
    </div>
  </div>

  <details class="manual-add">
    <summary>Add a match manually</summary>
    <div class="manual-grid">
      <input type="text" id="manAway" placeholder="Away team">
      <input type="text" id="manHome" placeholder="Home team">
      <input type="time" id="manTime" placeholder="Time (IST)">
      <button class="btn" id="manAddBtn">Add match</button>
    </div>
  </details>

  <div class="footer-credit">Site developed by Rakesh Radhakrishnan</div>

</div>

<script>
(function(){

  // ---------- helpers ----------
  function pad(n){ return String(n).padStart(2,'0'); }

  function to12h(hh, mm){
    const h = Number(hh), m = Number(mm);
    const ap = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12;
    if(h12 === 0) h12 = 12;
    return h12 + ':' + pad(m) + ' ' + ap;
  }
  function to12hFromColonString(t24){
    const [h,m] = String(t24).split(':');
    return to12h(h, m);
  }

  function istNow(){
    // Date.getTime() is already an absolute UTC timestamp regardless of the
    // browser's local timezone, so we only need to add the fixed IST offset.
    const now = new Date();
    return new Date(now.getTime() + 5.5*3600000);
  }

  function istDateKey(d){
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }

  function addDays(dateKey, n){
    const [y,m,d] = dateKey.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m-1, d));
    dt.setUTCDate(dt.getUTCDate()+n);
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth()+1) + '-' + pad(dt.getUTCDate());
  }

  function fmtDateHuman(dateKey){
    const [y,m,d] = dateKey.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m-1, d, 12));
    return dt.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC' });
  }

  // convert a UTC ISO game date string to IST hh:mm and IST date-key
  function utcToIst(isoUtc){
    const d = new Date(isoUtc);
    const istMs = d.getTime() + 5.5*3600000;
    const ist = new Date(istMs);
    const hh = pad(ist.getUTCHours());
    const mm = pad(ist.getUTCMinutes());
    const dateKey = ist.getUTCFullYear() + '-' + pad(ist.getUTCMonth()+1) + '-' + pad(ist.getUTCDate());
    return { time: hh+':'+mm, dateKey, sortMs: d.getTime() };
  }

  // ---------- storage ----------
  // All data is shared: true, so every analyst who opens this file sees the same
  // roster, matches, and assignments — one shared source of truth for the team.
  // Data lives in a Google Sheet via an Apps Script web app — this makes the file
  // fully standalone (works when hosted/opened anywhere, no Claude runtime needed).
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbz5DFf6TVvAMI6mk4MUhvJs7JPDzV6b2_Xyivo4glNHyYMkcSu6HJqGA-03Wx8vG0I-/exec';

  // Low-level read that reports success/failure explicitly, so callers (especially
  // background polling) can tell "server says empty" apart from "request failed" —
  // a failed request should never be treated as "there's no data".
  async function rawGet(key){
    try{
      const res = await fetch(`${SHEET_API_URL}?action=get&key=${encodeURIComponent(key)}`);
      if(!res.ok) return { ok:false };
      const data = await res.json();
      return { ok:true, found: !!data.found, value: data.value };
    }catch(e){ return { ok:false }; }
  }

  async function loadJSON(key, fallback){
    const r = await rawGet(key);
    if(!r.ok || !r.found) return fallback;
    try{ return JSON.parse(r.value); }catch(e){ return fallback; }
  }
  async function saveJSON(key, value){
    try{
      // text/plain avoids a CORS preflight that Apps Script web apps don't handle
      await fetch(SHEET_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'set', key, value: JSON.stringify(value) })
      });
    }catch(e){ console.error('sheet save failed', key, e); }
  }

  // ---------- state ----------
  let analysts = [];               // [{id,name,active}] — for whichever shift is currently active
  let currentShift = '1';          // '1' or '2'
  let lastLocalShiftChangeAt = 0;  // guards against a lagging poll reverting our own toggle
  let lastLocalRosterChangeAt = 0; // guards against a lagging poll reverting a rename/add/remove/save
  function analystsKey(){ return 'analysts:shift' + currentShift; }
  function assignmentsKey(dateKey){ return 'assignments:' + dateKey + ':shift' + currentShift; }
  function defaultRosterForShift(shift){
    if(shift === '2'){
      return [
        { id: 'c1', name:'Megha', active:true },
        { id: 'c2', name:'Rakesh', active:true },
        { id: 'c3', name:'Shloka', active:true },
      ];
    }
    return [
      { id: 'a1', name:'Abhay', active:true },
      { id: 'a2', name:'Sachin', active:true },
      { id: 'a3', name:'Aswath', active:true },
    ];
  }
  let currentDateKey = istDateKey(istNow());
  let matches = [];                // [{id, timeIst, sortMs, away, home, venue, manual}]
  let assignments = {};            // { matchId: { analystId, reported } }

  const els = {
    clock: document.getElementById('clock'),
    dateInput: document.getElementById('dateInput'),
    statusLine: document.getElementById('statusLine'),
    analystList: document.getElementById('analystList'),
    matches: document.getElementById('matches'),
    summary: document.getElementById('summary'),
    rosterBody: document.getElementById('rosterBody'),
    rosterChev: document.getElementById('rosterChev'),
  };

  function setStatus(msg, isErr){
    els.statusLine.textContent = msg || '';
    els.statusLine.className = 'status-line' + (isErr ? ' err' : '');
  }

  function tickClock(){
    const n = istNow();
    els.clock.textContent = to12h(n.getUTCHours(), n.getUTCMinutes());
  }
  setInterval(tickClock, 1000*15);

  // ---------- analyst roster ----------
  function uid(){ return Math.random().toString(36).slice(2,9); }

  // If someone is mid-typing a rename and hasn't clicked away yet, the browser's
  // 'change' event hasn't fired, so the analysts array still holds the old name.
  // Pull whatever's currently in each text box into the array before anything
  // (like switching shifts) reloads data and could stomp on an unsaved edit.
  function flushAnalystNameEdits(){
    document.querySelectorAll('.analyst-name-input').forEach(inp=>{
      const a = analysts.find(x => x.id === inp.dataset.id);
      const v = inp.value.trim();
      if(a && v) a.name = v;
    });
  }

  // Color by roster position: 1st analyst = yellow, 2nd = blue, 3rd = orange.
  // Extra colors kick in only if a 4th+ analyst is added.
  const ANALYST_PALETTE = ['#F2D250','#5B8DEF','#F2994A','#C77DD1','#4FC3D9','#45B8AC','#D1728F','#8E7CC3'];
  function analystColor(id){
    const idx = analysts.findIndex(a => a.id === id);
    if(idx === -1) return ANALYST_PALETTE[0];
    return ANALYST_PALETTE[idx % ANALYST_PALETTE.length];
  }

  function renderAnalysts(){
    els.analystList.innerHTML = '';
    analysts.forEach(a=>{
      const row = document.createElement('div');
      row.className = 'analyst-row';
      row.innerHTML = `
        <span class="analyst-dot" style="background:${analystColor(a.id)}"></span>
        <input type="text" value="${escapeAttr(a.name)}" data-id="${a.id}" class="analyst-name-input">
        <button class="avail-toggle ${a.active?'on':'off'}" data-id="${a.id}">${a.active?'Available':'On leave'}</button>
        <button class="remove-x" data-id="${a.id}" title="Remove">✕</button>
      `;
      els.analystList.appendChild(row);
    });

    els.analystList.querySelectorAll('.analyst-name-input').forEach(inp=>{
      inp.addEventListener('change', async e=>{
        lastLocalRosterChangeAt = Date.now();
        const a = analysts.find(x=>x.id===e.target.dataset.id);
        if(a){ a.name = e.target.value.trim() || a.name; await saveJSON(analystsKey(), analysts); renderMatches(); }
      });
    });
    els.analystList.querySelectorAll('.avail-toggle').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        lastLocalRosterChangeAt = Date.now();
        const a = analysts.find(x=>x.id===e.target.dataset.id);
        if(a){ a.active = !a.active; await saveJSON(analystsKey(), analysts); renderAnalysts(); renderMatches(); }
      });
    });
    els.analystList.querySelectorAll('.remove-x').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        lastLocalRosterChangeAt = Date.now();
        analysts = analysts.filter(x=>x.id!==e.target.dataset.id);
        await saveJSON(analystsKey(), analysts);
        renderAnalysts(); renderMatches();
      });
    });
  }

  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  document.getElementById('addAnalystBtn').addEventListener('click', async ()=>{
    lastLocalRosterChangeAt = Date.now();
    const inp = document.getElementById('newAnalystName');
    const name = inp.value.trim();

        manual: false
      });
    });
    out.sort((a,b)=>a.sortMs-b.sortMs);
    return out;

    const live = await fetchLiveScheduleForIstDate(currentDateKey);
    const manualOnes = matches.filter(m=>m.manual);
    const merged = mergeGameLists(baked, live);
    matches = [...merged, ...manualOnes].sort((a,b)=>a.sortMs-b.sortMs);
    await saveJSON('matches:' + currentDateKey, matches);
    if(matches.length - manualOnes.length === 0){
      setStatus(`No MLB games found for ${fmtDateHuman(currentDateKey)}. Add matches manually below.`, true);
    } else {
      setStatus(`${matches.length - manualOnes.length} match${matches.length-manualOnes.length===1?'':'es'} loaded for ${fmtDateHuman(currentDateKey)} (snapshot + live check).`);
    }
    renderMatches();
  });

  // merge two game-object lists, de-duplicating by away|home team pair, baked list wins on conflict
  function mergeGameLists(primary, extra){
    const seen = new Set(primary.map(g=>g.away+'|'+g.home));
    const out = [...primary];
    extra.forEach(g=>{
      const k = g.away+'|'+g.home;
      if(!seen.has(k)){ seen.add(k); out.push(g); }
    });
    out.sort((a,b)=>a.sortMs-b.sortMs);
    return out;
  }

  // ---------- live schedule check (via Claude + web search, for dates the snapshot misses or same-day changes) ----------
  async function callClaudeSearch(prompt){
    try{
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:1500,
          messages:[{ role:'user', content: prompt }],
          tools:[{ type:'web_search_20250305', name:'web_search' }]
        })
      });
      if(!res.ok) return null;
      const data = await res.json();
      const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
      const clean = text.replace(/```json|```/g,'').trim();
      const start = clean.indexOf('[');
      const end = clean.lastIndexOf(']');
      if(start===-1 || end===-1) return null;
      return JSON.parse(clean.slice(start, end+1));
    }catch(e){ console.error('live schedule check failed', e); return null; }
  }

  function etToUtcIso(dateStr, etTimeStr){
    const m = /^(\d{1,2}):(\d{2})\s*([AP]M)$/i.exec(String(etTimeStr).trim());
    if(!m || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
    let hh = parseInt(m[1],10);
    const mm = m[2];
    const ap = m[3].toUpperCase();
    if(ap==='PM' && hh!==12) hh+=12;
    if(ap==='AM' && hh===12) hh=0;
    return `${dateStr}T${pad(hh)}:${mm}:00-04:00`; // MLB season = US Eastern Daylight Time
  }

  async function fetchLiveScheduleForIstDate(dateKey){
    const usPrev = addDays(dateKey,-1);
    const prompt = `Search the web for the official MLB game schedule for ${usPrev} and ${dateKey} (both are US Eastern Time calendar dates). List every MLB regular-season or postseason game scheduled on either date that has a confirmed start time. Return ONLY a JSON array and nothing else — no prose, no markdown code fences. Each element must have exactly these fields: "date" (the US Eastern calendar date printed on the schedule, format YYYY-MM-DD), "et_time" (start time exactly as published, e.g. "7:05 PM"), "away" (away team full name), "home" (home team full name), "venue" (ballpark name). Omit any game without a confirmed time. If there are no games on either date, return [].`;
    const parsed = await callClaudeSearch(prompt);
    if(!Array.isArray(parsed)) return [];
    const out = [];
    parsed.forEach(g=>{
      if(!g || !g.away || !g.home) return;
      const iso = etToUtcIso(g.date, g.et_time);
      if(!iso) return;
      const conv = utcToIst(iso);
      if(conv.dateKey !== dateKey) return;
      out.push({
        id: 'live-' + slug(g.away) + '-' + slug(g.home) + '-' + dateKey,
        timeIst: conv.time,
        sortMs: conv.sortMs,
        away: g.away,
        home: g.home,
        venue: g.venue || '',
        status: 'Scheduled',
        manual: false
      });
    });
    out.sort((a,b)=>a.sortMs-b.sortMs);
    return out;
  }
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,''); }

  // ---------- manual match add ----------
  document.getElementById('manAddBtn').addEventListener('click', async ()=>{
    const away = document.getElementById('manAway').value.trim();
    const home = document.getElementById('manHome').value.trim();
    const time = document.getElementById('manTime').value;
    if(!away || !home || !time){ setStatus('Fill in both teams and a time to add a match manually.', true); return; }
    const [hh,mm] = time.split(':').map(Number);
    const [y,mo,d] = currentDateKey.split('-').map(Number);
    const sortMs = Date.UTC(y, mo-1, d, hh-5, mm-30); // approximate sort key
    matches.push({ id:'man-'+uid(), timeIst: time, sortMs, away, home, venue:'', status:'', manual:true });
    matches.sort((a,b)=>a.sortMs-b.sortMs);
    await saveJSON('matches:' + currentDateKey, matches);
    document.getElementById('manAway').value='';
    document.getElementById('manHome').value='';
    document.getElementById('manTime').value='';
    setStatus('Match added.');
    renderMatches();
  });

  // ---------- assignment ----------
  function activeAnalysts(){ return analysts.filter(a=>a.active); }

  async function setAssignment(matchId, analystId){
    assignments[matchId] = assignments[matchId] || {};
    assignments[matchId].analystId = analystId || null;
    await saveJSON(assignmentsKey(currentDateKey), assignments);
    renderMatches();
  }

  async function toggleReported(matchId){
    assignments[matchId] = assignments[matchId] || {};
    assignments[matchId].reported = !assignments[matchId].reported;
    await saveJSON(assignmentsKey(currentDateKey), assignments);
    renderMatches();
  }

  // Round-robin assignment where the analyst who opens the day (gets the first match)
  // rotates daily, so nobody is stuck with the first match every day.
  function rotationOrderFor(dateKey, pool){
    if(pool.length===0) return [];
    const dayIndex = Math.floor(Date.parse(dateKey + 'T00:00:00Z') / 86400000);
    const startIdx = dayIndex % pool.length;
    return pool.slice(startIdx).concat(pool.slice(0, startIdx));
  }

  function autoAssignRotation(dateKey, matchList, assignmentsObj){
    const pool = activeAnalysts();
    if(pool.length===0) return assignmentsObj;
    const rotated = rotationOrderFor(dateKey, pool);
    let i = 0;
    matchList.forEach(m=>{
      if(inNoAssignWindow(m.timeIst)) return; // shift gap — leave as "need support", never auto-assign
      const cur = assignmentsObj[m.id]?.analystId;
      if(cur && pool.find(p=>p.id===cur)) return; // keep an already-valid assignment
      assignmentsObj[m.id] = assignmentsObj[m.id] || {};
      assignmentsObj[m.id].analystId = rotated[i % rotated.length].id;
      i++;
    });
    return assignmentsObj;
  }

  document.getElementById('autoAssignBtn').addEventListener('click', async ()=>{
    const pool = activeAnalysts();
    if(pool.length===0){ setStatus('Add at least one available analyst first.', true); return; }
    assignments = autoAssignRotation(currentDateKey, matches, assignments);
    await saveJSON(assignmentsKey(currentDateKey), assignments);
    const firstName = analysts.find(a=>a.id===rotationOrderFor(currentDateKey,pool)[0]?.id)?.name || '';
    setStatus(`Matches auto-assigned. ${firstName} opens today's rotation.`);
    renderMatches();
  });

  // Loads (baked snapshot + live check) and auto-assigns a date's matches immediately —
  // no time-of-day gating. Used whenever a date is opened and has no matches yet.
  async function loadAndAssignDate(dateKey){
    let existing = await loadJSON('matches:' + dateKey, []);
    if(existing.length > 0) return existing;
    const baked = scheduleForIstDate(dateKey);
    const live = await fetchLiveScheduleForIstDate(dateKey);
    const manualOnes = existing.filter(m=>m.manual);
    const merged = mergeGameLists(baked, live);
    const finalList = [...merged, ...manualOnes].sort((a,b)=>a.sortMs-b.sortMs);
    if(finalList.length === 0) return finalList;
    let dateAssignments = await loadJSON(assignmentsKey(dateKey), {});
    dateAssignments = autoAssignRotation(dateKey, finalList, dateAssignments);
    await saveJSON('matches:' + dateKey, finalList);
    await saveJSON(assignmentsKey(dateKey), dateAssignments);
    return finalList;
  }

  function hexToRgba(hex, alpha){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // status text/markup for a match based on its scheduled start (sortMs = UTC epoch ms)
  const ESTIMATED_GAME_DURATION_MS = 3.5 * 3600000; // MLB games typically run ~3–3.5 hours
  function matchStatusHtml(sortMs){
    const now = Date.now();
    const diff = sortMs - now;
    if(diff > 0){
      const mins = Math.round(diff/60000);
      if(mins < 60) return '<span class="m-countdown">Starts in ' + mins + 'm</span>';
      const hrs = Math.floor(mins/60), remMin = mins%60;
      return '<span class="m-countdown">Starts in ' + hrs + 'h' + (remMin ? ' ' + remMin + 'm' : '') + '</span>';
    }
    const sinceStart = now - sortMs;
    if(sinceStart <= ESTIMATED_GAME_DURATION_MS){
      return '<span class="m-live">● LIVE</span>';
    }
    return '<span class="m-finished">Finished (est.)</span>';
  }
  // Matches landing between 7:00–10:00 AM IST fall in the shift gap: nobody should
  // be assigned there — the row should just flag that it needs outside support.
  function inNoAssignWindow(timeIst){
    const [hh, mm] = String(timeIst).split(':').map(Number);
    const minutesSinceMidnight = hh * 60 + mm;
    return minutesSinceMidnight >= 420 && minutesSinceMidnight <= 600;
  }

  function tickMatchTimers(){
    document.querySelectorAll('.m-status[data-start]').forEach(el=>{
      el.innerHTML = matchStatusHtml(Number(el.dataset.start));
    });
  }
  setInterval(tickMatchTimers, 20000);

  // ---------- render matches ----------
  function renderMatches(){
    if(matches.length===0){
      els.matches.innerHTML = `<div class="empty-state"><div class="big">No matches loaded yet</div><div>Pick a date above — matches load automatically from the schedule snapshot.</div></div>`;
      els.summary.innerHTML='';
      return;
    }
    let unassignedCount = 0, reportedCount = 0, needSupportCount = 0;
    let dividerInserted = false;
    const rowsHtml = [];

    matches.forEach((m, idx)=>{
      const a = assignments[m.id] || {};
      const reported = !!a.reported;
      const afterShift = inNoAssignWindow(m.timeIst);
      if(afterShift){ needSupportCount++; }
      else if(!a.analystId){ unassignedCount++; }
      if(reported) reportedCount++;
      const color = a.analystId ? analystColor(a.analystId) : null;
      const optionsHtml = ['<option value="">— assign —</option>']
        .concat(analysts.map(an => `<option value="${an.id}" ${a.analystId===an.id?'selected':''}>${escapeHtml(an.name)}${an.active?'':' (leave)'}</option>`))
        .join('');
      const assignHtml = afterShift
        ? `<span class="need-support">Need support</span>`
        : `
            <span class="assign-dot" style="background:${color || 'transparent'}; border-color:${color || 'var(--line)'}"></span>
            <select class="${a.analystId?'':'empty'}" data-mid="${m.id}" style="${color ? `border-color:${color};color:${color};background:${hexToRgba(color,0.14)};` : ''}">${optionsHtml}</select>
          `;

      // Insert a divider right before the first match starting at/after 8 PM IST —
      // that's shift start, and everything before it (including the 7–10 AM gap) is
      // effectively "the tail end of the previous coverage window."
      const [hh] = String(m.timeIst).split(':').map(Number);
      if(!dividerInserted && idx > 0 && hh >= 20){
        rowsHtml.push(`
          <div class="shift-divider">
            <span class="shift-divider-line"></span>
          </div>
        `);
        dividerInserted = true;
      }

      rowsHtml.push(`
        <div class="match ${(!afterShift && !a.analystId)?'unassigned':''} ${reported?'reported':''}">
          <div class="m-time ${afterShift?'after-shift':''}">${escapeHtml(to12hFromColonString(m.timeIst))}<span>${afterShift?'7–10 AM':'IST'}</span></div>
          <div class="m-teams">
            <div class="vs">${escapeHtml(m.away)} vs ${escapeHtml(m.home)}</div>
            <div class="venue">${escapeHtml(m.venue || (m.manual?'Manually added':''))}</div>
            <div class="m-status" data-start="${m.sortMs}">${matchStatusHtml(m.sortMs)}</div>
          </div>
          <div class="m-assign">
            ${assignHtml}
          </div>
          <button class="m-report ${reported?'done':''}" data-mid="${m.id}" title="Mark reported">${reported?'✓':'○'}</button>
        </div>
      `);
    });

    els.matches.innerHTML = rowsHtml.join('');

    els.matches.querySelectorAll('select[data-mid]').forEach(sel=>{
      sel.addEventListener('change', e=> setAssignment(e.target.dataset.mid, e.target.value));
    });
    els.matches.querySelectorAll('.m-report').forEach(btn=>{
      btn.addEventListener('click', e=> toggleReported(e.target.dataset.mid));
    });

    els.summary.innerHTML = `
      <div class="chip"><b>${matches.length}</b> match${matches.length===1?'':'es'}</div>
      <div class="chip ${unassignedCount>0?'warn':'good'}"><b>${unassignedCount}</b> unassigned</div>
      <div class="chip good"><b>${reportedCount}</b> reported</div>
      <div class="chip ${needSupportCount>0?'warn':''}"><b>${needSupportCount}</b> need support (7–10 AM)</div>
      <div class="chip"><b>${activeAnalysts().length}</b> analysts available</div>
    `;
  }

  // ---------- date navigation ----------
  async function setDate(dateKey){
    currentDateKey = dateKey;
    els.dateInput.value = dateKey;
    matches = await loadJSON('matches:' + dateKey, []);
    assignments = await loadJSON(assignmentsKey(dateKey), {});

    if(matches.length === 0){
      setStatus(`Loading matches for ${fmtDateHuman(dateKey)}…`);
      renderMatches();
      matches = await loadAndAssignDate(dateKey);
      assignments = await loadJSON(assignmentsKey(dateKey), {});
    }

    // Matches may already have been cached from before, but this shift's assignment
    // key can still be empty (e.g. first time this shift has looked at this date) —
    // make sure the current shift's team actually gets assigned regardless.
    if(matches.length > 0 && Object.keys(assignments).length === 0){
      assignments = autoAssignRotation(dateKey, matches, assignments);
      await saveJSON(assignmentsKey(dateKey), assignments);
    }

    setStatus(matches.length
      ? `Showing ${fmtDateHuman(dateKey)}.`
      : `No MLB games found for ${fmtDateHuman(dateKey)}. Add matches manually below.`);
    renderMatches();
  }

  document.getElementById('dateInput').addEventListener('change', e=> setDate(e.target.value));
  document.getElementById('prevDay').addEventListener('click', ()=> setDate(addDays(currentDateKey,-1)));
  document.getElementById('nextDay').addEventListener('click', ()=> setDate(addDays(currentDateKey,1)));
  document.getElementById('todayBtn').addEventListener('click', ()=> setDate(istDateKey(istNow())));

  // ---------- live sync between everyone viewing this file ----------
  function snap(v){ return JSON.stringify(v); }
  async function pollForUpdates(){
    const [mRes, aRes, anRes, shiftRes] = await Promise.all([
      rawGet('matches:' + currentDateKey),
      rawGet(assignmentsKey(currentDateKey)),
      rawGet(analystsKey()),
      rawGet('currentShift')
    ]);
    let changed = false;
    let shiftSwitched = false;

    // If someone else switched the shared shift toggle, follow it and reload that shift's roster.
    // Skip this if we ourselves just toggled a moment ago — the sheet write may not have
    // fully propagated yet, and we don't want our own change getting reverted by a stale read.
    const recentlyToggledLocally = (Date.now() - lastLocalShiftChangeAt) < 20000;
    let remoteShift = null;
    if(!recentlyToggledLocally && shiftRes.ok && shiftRes.found){
      try{ remoteShift = JSON.parse(shiftRes.value); }catch(e){ remoteShift = null; }
    }
    if(remoteShift && remoteShift !== currentShift){
      currentShift = remoteShift;
      shiftSwitched = true;
      updateShiftToggleUI();
      const freshRoster = await loadJSON(analystsKey(), defaultRosterForShift(currentShift));
      analysts = freshRoster;
      renderAnalysts();
      // aRes above was fetched under the old shift key — re-fetch for the shift we just switched to
      assignments = await loadJSON(assignmentsKey(currentDateKey), {});
      changed = true;
    } else {
      const recentlyEditedRosterLocally = (Date.now() - lastLocalRosterChangeAt) < 20000;
      try{
        if(!recentlyEditedRosterLocally && anRes.ok){
          const freshAnalysts = anRes.found ? JSON.parse(anRes.value) : analysts;
          if(snap(freshAnalysts) !== snap(analysts)){ analysts = freshAnalysts; renderAnalysts(); changed = true; }
        }
      }catch(e){ /* skip */ }
    }

    try{
      if(mRes.ok){
        const freshMatches = mRes.found ? JSON.parse(mRes.value) : [];
        if(snap(freshMatches) !== snap(matches)){ matches = freshMatches; changed = true; }
      }
    }catch(e){ /* skip */ }

    if(!shiftSwitched){
      try{
        if(aRes.ok){
          const freshAssignments = aRes.found ? JSON.parse(aRes.value) : {};
          if(snap(freshAssignments) !== snap(assignments)){ assignments = freshAssignments; changed = true; }
        }
      }catch(e){ /* skip */ }
    }

    if(changed) renderMatches();
  }
  setInterval(pollForUpdates, 15000);

  // ---------- shift toggle ----------
  function updateShiftToggleUI(){
    const btn = document.getElementById('shiftToggle');
    const isTwo = currentShift === '2';
    btn.classList.toggle('on', isTwo);
    btn.setAttribute('aria-checked', String(isTwo));
    document.getElementById('shiftLabel1').classList.toggle('active', !isTwo);
    document.getElementById('shiftLabel2').classList.toggle('active', isTwo);
    document.getElementById('rosterHeading').textContent = `Shift ${currentShift} analysts`;
  }

  // ---------- init ----------
  async function init(){
    tickClock();
    currentShift = await loadJSON('currentShift', '1');
    updateShiftToggleUI();
    analysts = await loadJSON(analystsKey(), defaultRosterForShift(currentShift));
    renderAnalysts();

    document.getElementById('shiftToggle').addEventListener('click', async ()=>{
      lastLocalShiftChangeAt = Date.now();
      // Commit any name still being typed for the shift we're about to leave
      flushAnalystNameEdits();
      await saveJSON(analystsKey(), analysts);

      currentShift = currentShift === '1' ? '2' : '1';
      updateShiftToggleUI();
      await saveJSON('currentShift', currentShift);
      analysts = await loadJSON(analystsKey(), defaultRosterForShift(currentShift));
      renderAnalysts();
      assignments = await loadJSON(assignmentsKey(currentDateKey), {});
      if(matches.length > 0){
        assignments = autoAssignRotation(currentDateKey, matches, assignments);
        await saveJSON(assignmentsKey(currentDateKey), assignments);
      }
      renderMatches();
    });

    await setDate(currentDateKey);
  }
  init();

})();
</script>
</body>
</html>
